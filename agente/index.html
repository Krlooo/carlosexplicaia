<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu agente personal · Guía gratis · Carlos explica IA</title>
<meta name="description" content="Monta tu agente de IA personal en una tarde, en tu ordenador, y háblale desde el móvil. Guía paso a paso, gratis.">
<meta property="og:title" content="Tu agente personal · Guía gratis">
<meta property="og:description" content="Móntalo en una tarde, paso a paso. Por @carlosexplicaia">
<meta property="og:image" content="cover.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%23e8126b'/></svg>">
<style>
@font-face{font-family:Anton;src:url(Anton-Regular.ttf)}
:root{--bg:#eeb3c9;--mag:#e8126b;--gra:#2b0515;--wh:#fff4f8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--gra);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
main{max-width:460px;width:100%;min-width:0}
.k{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mag)}
h1{font:400 64px/.9 Anton,Impact,sans-serif;margin:14px 0 16px}
p{font-size:18px;line-height:1.5}
img{display:block;width:70%;max-width:300px;margin-left:auto!important;margin-right:auto!important;border-radius:18px;box-shadow:0 30px 60px -24px rgba(43,5,21,.55);margin:24px 0}
input[type=email]{width:100%;font-size:18px;padding:18px 20px;border-radius:999px;border:2px solid #fff;background:#fff4f8;color:var(--gra);margin-bottom:12px;outline:none}
input[type=email]:focus{border-color:var(--mag)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;margin:4px 6px 16px}
.ck input{width:20px;height:20px;accent-color:var(--mag);flex:none;margin-top:1px}
.ck a{color:var(--gra)}
#m{margin-top:14px;font-weight:700;text-align:center;min-height:1.4em}
.btn{width:100%;border:0;cursor:pointer;display:block;text-align:center;background:var(--mag);color:#fff;text-decoration:none;font-weight:800;font-size:20px;padding:20px;border-radius:999px;box-shadow:0 18px 36px -16px rgba(232,18,107,.8)}
.f{margin-top:22px;font:500 12px ui-monospace,Menlo,monospace;letter-spacing:.08em;opacity:.65;text-align:center}
.f a{color:inherit}
</style></head>
<body><main>
<div class="k">Guía gratis · Carlos explica IA</div>
<h1>TU AGENTE<br>PERSONAL</h1>
<p>Móntalo en una tarde, en tu ordenador, y háblale desde el móvil. 12 páginas, paso a paso, sin saber programar. Déjame tu email y te la mando.</p>
<form id="f" novalidate>
  <input name="email" type="email" required placeholder="tu@email.com" autocomplete="email" aria-label="Tu email">
  <input name="website" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
  <label class="ck"><input type="checkbox" name="consent" value="yes" required>
  <span>Quiero recibir la guía y los emails de Carlos explica IA, como mucho uno a la semana. Me doy de baja con un clic cuando quiera. <a href="../privacidad/">Privacidad</a></span></label>
  <button class="btn">Enviarme la guía</button>
  <p id="m" role="status"></p>
</form>
<img src="cover.png" alt="Portada de la guía">

<div class="f">¿Te atascas? Escríbeme en Instagram · <a href="https://www.instagram.com/carlosexplicaia/">@carlosexplicaia</a></div>
</main>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, m = document.getElementById('m'), b = f.querySelector('button');
  const email = f.email.value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { m.textContent = 'Revisa tu email.'; return; }
  if (!f.consent.checked) { m.textContent = 'Marca la casilla para que pueda enviártela.'; return; }
  b.disabled = true; m.textContent = 'Enviando…';
  try {
    const r = await fetch('https://lista.krlo.dev/api/subscribe', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, consent: 'yes', website: f.website.value, origen: 'reel-agente' }) });
    const j = await r.json().catch(() => ({}));
    m.textContent = r.ok ? '¡Listo! Mira tu correo y pulsa «Confirmar». Si no lo ves, revisa spam o promociones.'
                         : 'No he podido apuntarte. Revisa el email y vuelve a probar.';
    if (r.ok) f.reset();
  } catch { m.textContent = 'Sin conexión. Vuelve a probar en un momento.'; }
  b.disabled = false;
});
</script></body></html>
